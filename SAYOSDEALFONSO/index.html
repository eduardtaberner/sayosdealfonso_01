<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SAYOSDEALFONSO</title>
  <link rel="icon" type="image/png" href="public/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: #000;
    }

    /* Contenedor del video - pantalla completa */
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    /* Base: escala per defecte */
    .video-container iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%) scale(1.5);
      pointer-events: none;
      object-fit: cover;
    }

    /* Pantalles menys de 900px */
    @media (max-width: 900px) {
      .video-container iframe {
        transform: translate(-50%, -50%) scale(2);
      }
    }

    /* Pantalles menys de 740px */
    @media (max-width: 740px) {
      .video-container iframe {
        transform: translate(-50%, -50%) scale(2.8);
      }
    }

    /* Pantalles menys de 600px */
    @media (max-width: 600px) {
      .video-container iframe {
        transform: translate(-50%, -50%) scale(3.5);
      }
    }

    /* Pantalles menys de 480px */
    @media (max-width: 480px) {
      .video-container iframe {
        transform: translate(-50%, -50%) scale(4.5);
      }
    }

    /* Pantalles menys de 400px */
    @media (max-width: 400px) {
      .video-container iframe {
        transform: translate(-50%, -50%) scale(5.5);
      }
    }

    /* Pantalles menys de 320px */
    @media (max-width: 320px) {
      .video-container iframe {
        transform: translate(-50%, -50%) scale(7);
      }
    }

    /* Overlay transparente que captura los clics */
    .click-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: pointer;
      background: transparent;
    }

    /* Logo esquina superior izquierda */
    .logo-container {
      position: fixed;
      top: 40px;
      left: 40px;
      z-index: 2;
      pointer-events: auto;
      cursor: pointer;
    }

    .logo-container img {
      height: 50px;
      width: auto;
      transition: all 0.3s ease;
    }

    /* Texto esquina superior derecha */
    .subtitulo {
      position: fixed;
      top: 48px;
      right: 40px;
      z-index: 2;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: white;
      background: transparent;
      text-decoration: none;
      pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .logo-container {
        top: 20px;
        left: 20px;
      }
      .logo-container img {
        height: 35px;
      }
      .subtitulo {
        top: 24px;
        right: 20px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Contenedor del video Vimeo -->
  <div id="bgVideoContainer" class="video-container"></div>
  
  <!-- Overlay para capturar clics -->
  <div id="clickOverlay" class="click-overlay"></div>
  
  <!-- Logo esquina superior izquierda -->
  <div class="logo-container">
    <img src="public/logo.png" alt="SAYOS DE ALFONSO" id="logo">
  </div>
  
  <!-- Texto esquina superior derecha -->
  <div class="subtitulo">Architects</div>

  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    (function() {
      const vimeoIds = [
        "1190537591",
        "1190537623",
        "1190537660",
        "1190537698",
        "1190537788",
        "1190537788",
        "1190537820",
        "1190537849"
      ];

      let currentPlayer = null;
      let currentIndex = -1;

      function createVimeoIframe(videoId, autoplay = true) {
        const iframe = document.createElement('iframe');
        let src = `https://player.vimeo.com/video/${videoId}?badge=0&autopause=0&player_id=0&app_id=58479&loop=1&muted=1&controls=0&background=1`;
        if (autoplay) {
          src += `&autoplay=1`;
        }
        iframe.src = src;
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share');
        iframe.setAttribute('allowfullscreen', '');
        return iframe;
      }

      function loadVideoByIndex(index) {
        const container = document.getElementById('bgVideoContainer');
        if (!container) return;
        
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }
        
        const iframe = createVimeoIframe(vimeoIds[index], true);
        container.appendChild(iframe);
        
        currentIndex = index;
        
        const player = new Vimeo.Player(iframe);
        currentPlayer = player;
        player.setVolume(0);
        player.play().catch(e => console.log("Autoplay requiere interacción", e));
      }

      function getRandomDifferentIndex(avoidIndex) {
        if (vimeoIds.length === 1) return 0;
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * vimeoIds.length);
        } while (newIndex === avoidIndex && vimeoIds.length > 1);
        return newIndex;
      }

      function changeToRandomVideo() {
        let newIndex;
        if (currentIndex === -1) {
          newIndex = Math.floor(Math.random() * vimeoIds.length);
        } else {
          newIndex = getRandomDifferentIndex(currentIndex);
        }
        loadVideoByIndex(newIndex);
      }

      function initRandomBackground() {
        const initialIndex = Math.floor(Math.random() * vimeoIds.length);
        loadVideoByIndex(initialIndex);
      }

      const overlay = document.getElementById('clickOverlay');
      if (overlay) {
        overlay.addEventListener('click', (e) => {
          e.stopPropagation();
          changeToRandomVideo();
        });
      }

      initRandomBackground();

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && currentPlayer) {
          currentPlayer.play().catch(e => {});
        }
      });

      // Logo hover effect
      const logo = document.getElementById('logo');
      if (logo) {
        const logoSrc = 'public/logo.png';
        const logoSrcHover = 'public/logo-hover.png';
        
        logo.addEventListener('mouseenter', () => {
          logo.src = logoSrcHover;
        });
        
        logo.addEventListener('mouseleave', () => {
          logo.src = logoSrc;
        });
      }
    })();
  </script>

  <!-- FOOTER AMB TEXT I ICONES CENTRADES -->
  <div style="position: fixed; bottom: 0; left: 0; width: 100%; background-color: white; z-index: 10; padding: 10px 15px;">
    <div style="max-width: 1200px; margin: 0 auto; text-align: center;">
      <p style="font-style: italic; font-size: 9px; margin: 0 0 10px 0; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
        Aquesta actuació està impulsada i subvencionada pel Departament d'Empresa i Treball i cofinançada per la Unió Europea mitjançant el Fons Social Europeu Plus.
      </p>
      <div style="display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: nowrap;">
        <img src="public/images/icons/icon_1.png" alt="Icona 1" style="width: min(120px, 18vw); height: auto; cursor: default;">
        <img src="public/images/icons/icon_2.png" alt="Icona 2" style="width: min(120px, 18vw); height: auto; cursor: default;">
        <img src="public/images/icons/icon_3.jpg" alt="Icona 3" style="width: min(120px, 18vw); height: auto; cursor: default;">
        <img src="public/images/icons/icon_4.svg" alt="Icona 4" style="width: min(120px, 18vw); height: auto; cursor: default;">
      </div>
    </div>
  </div>

</body>
</html>
