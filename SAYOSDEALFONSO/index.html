<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>sayosdealfonso</title>
  <link rel="icon" type="image/png" href="public/favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow-y: auto;
      overflow-x: hidden;
      background-color: #000;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      background-color: #000;
    }

    .video-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.3s ease-in-out;
      opacity: 1;
      z-index: 1;
    }
    
    .video-layer.hidden {
      opacity: 0;
      z-index: 0;
    }
    
    .video-layer iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%) scale(1.5);
      pointer-events: none;
      object-fit: cover;
    }

    @media (max-width: 900px) {
      .video-layer iframe {
        transform: translate(-50%, -50%) scale(2);
      }
    }

    @media (max-width: 740px) {
      .video-layer iframe {
        transform: translate(-50%, -50%) scale(2.8);
      }
    }

    @media (max-width: 600px) {
      .video-layer iframe {
        transform: translate(-50%, -50%) scale(3.5);
      }
    }

    @media (max-width: 480px) {
      .video-layer iframe {
        transform: translate(-50%, -50%) scale(4.5);
      }
    }

    @media (max-width: 400px) {
      .video-layer iframe {
        transform: translate(-50%, -50%) scale(5.5);
      }
    }

    @media (max-width: 320px) {
      .video-layer iframe {
        transform: translate(-50%, -50%) scale(7);
      }
    }

    .click-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
      background: transparent;
    }

    .logo-container {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      pointer-events: auto;
      cursor: pointer;
    }

    .logo-container img {
      height: 50px;
      width: auto;
      transition: all 0.3s ease;
    }

    @media (max-width: 640px) {
      .logo-container {
        top: 20px;
        left: 20px;
        transform: none;
      }
      .logo-container img {
        height: 35px;
      }
    }

    .footer {
      width: 100%;
      background-color: white;
      padding: 10px 15px;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <div id="videoLayer1" class="video-layer"></div>
    <div id="videoLayer2" class="video-layer hidden"></div>
    <div id="clickOverlay" class="click-overlay"></div>
    <div class="logo-container">
      <img src="public/logo.png" alt="SAYOS DE ALFONSO" id="logo">
    </div>
  </div>

  <div class="footer">
    <div style="max-width: 1200px; margin: 0 auto; text-align: center;">
      <p style="font-style: italic; font-size: 9px; margin: 0 0 10px 0; color: #333; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
        Aquesta actuació està impulsada i subvencionada pel Departament d'Empresa i Treball i cofinançada per la Unió Europea mitjançant el Fons Social Europeu Plus.
      </p>
      <div style="display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: nowrap;">
        <img src="public/images/icons/icon_1.png" alt="Icona 1" style="width: min(120px, 18vw); height: auto; cursor: default;">
        <img src="public/images/icons/icon_2.png" alt="Icona 2" style="width: min(120px, 18vw); height: auto; cursor: default;">
        <img src="public/images/icons/icon_3.jpg" alt="Icona 3" style="width: min(120px, 18vw); height: auto; cursor: default;">
        <img src="public/images/icons/icon_4.svg" alt="Icona 4" style="width: min(120px, 18vw); height: auto; cursor: default;">
      </div>
    </div>
  </div>

  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    (function() {
      const vimeoIds = [
        "1196639365",
        "1190537623",
        "1196639364",
        "1196639407",
        "1196639406",
        "1196639363",
        "1196639383",
        "1196639404"
      ];

      let currentPlayer = null;
      let currentIndex = -1;
      let currentLayer = 1;
      let isChanging = false;
      
      const layer1 = document.getElementById('videoLayer1');
      const layer2 = document.getElementById('videoLayer2');
      
      function getStoredIndex() {
        const stored = sessionStorage.getItem('vimeoCurrentIndex');
        if (stored !== null && !isNaN(parseInt(stored))) {
          return parseInt(stored);
        }
        return -1;
      }
      
      function saveIndex(index) {
        sessionStorage.setItem('vimeoCurrentIndex', index);
      }

      function createVimeoIframe(videoId, autoplay = true) {
        const iframe = document.createElement('iframe');
        let src = `https://player.vimeo.com/video/${videoId}?badge=0&autopause=0&player_id=0&app_id=58479&loop=1&muted=1&controls=0&background=1`;
        if (autoplay) {
          src += `&autoplay=1`;
        }
        iframe.src = src;
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share');
        iframe.setAttribute('allowfullscreen', '');
        return iframe;
      }

      function loadVideoInLayer(layer, videoId, callback) {
        while (layer.firstChild) {
          layer.removeChild(layer.firstChild);
        }
        
        const iframe = createVimeoIframe(videoId, true);
        layer.appendChild(iframe);
        
        const player = new Vimeo.Player(iframe);
        player.setVolume(0);
        
        player.ready().then(() => {
          player.play().then(() => {
            if (callback) callback(player);
          }).catch(() => {
            if (callback) callback(player);
          });
        }).catch(() => {
          if (callback) callback(player);
        });
      }

      function transitionToNextVideo() {
        if (isChanging) return;
        
        isChanging = true;
        
        const nextIndex = (currentIndex + 1) % vimeoIds.length;
        const nextVideoId = vimeoIds[nextIndex];
        const currentLayerElem = (currentLayer === 1) ? layer1 : layer2;
        const nextLayerElem = (currentLayer === 1) ? layer2 : layer1;
        
        nextLayerElem.classList.remove('hidden');
        
        loadVideoInLayer(nextLayerElem, nextVideoId, (newPlayer) => {
          setTimeout(() => {
            currentLayerElem.classList.add('hidden');
            
            currentPlayer = newPlayer;
            currentIndex = nextIndex;
            currentLayer = (currentLayer === 1) ? 2 : 1;
            saveIndex(currentIndex);
            
            setTimeout(() => {
              const oldLayerElem = (currentLayer === 1) ? layer2 : layer1;
              oldLayerElem.classList.add('hidden');
              
              setTimeout(() => {
                while (oldLayerElem.firstChild) {
                  oldLayerElem.removeChild(oldLayerElem.firstChild);
                }
              }, 100);
            }, 50);
            
            isChanging = false;
          }, 50);
        });
      }

      function loadInitialVideo(index) {
        while (layer1.firstChild) {
          layer1.removeChild(layer1.firstChild);
        }
        while (layer2.firstChild) {
          layer2.removeChild(layer2.firstChild);
        }
        
        layer2.classList.add('hidden');
        
        const iframe = createVimeoIframe(vimeoIds[index], true);
        layer1.appendChild(iframe);
        
        currentPlayer = new Vimeo.Player(iframe);
        currentPlayer.setVolume(0);
        currentIndex = index;
        currentLayer = 1;
        saveIndex(currentIndex);
        
        currentPlayer.ready().then(() => {
          currentPlayer.play().catch(() => {});
        }).catch(() => {});
      }

      function initRandomBackground() {
        let storedIndex = getStoredIndex();
        
        if (storedIndex === -1) {
          const randomIndex = Math.floor(Math.random() * vimeoIds.length);
          loadInitialVideo(randomIndex);
        } else {
          loadInitialVideo(storedIndex);
        }
      }

      const overlay = document.getElementById('clickOverlay');
      if (overlay) {
        overlay.addEventListener('click', (e) => {
          e.stopPropagation();
          transitionToNextVideo();
        });
      }

      const logo = document.getElementById('logo');
      if (logo) {
        const logoSrc = 'public/logo.png';
        const logoSrcHover = 'public/logo-hover.png';
        logo.addEventListener('mouseenter', () => { 
          logo.src = logoSrcHover; 
        });
        logo.addEventListener('mouseleave', () => { 
          logo.src = logoSrc; 
        });
        
        logo.addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = 'mailto:sayosdealfonso@gmail.com';
        });
      }

      initRandomBackground();

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && currentPlayer) {
          currentPlayer.play().catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>
