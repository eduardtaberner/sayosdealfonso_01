<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAYOS DE ALFONSO</title>
  <link rel="icon" type="image/png" href="public/favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .video-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .video-layer.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* El iframe mantiene una proporción 16:9 y cubre toda la ventana. */
    .video-layer iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: max(100vw, 177.78dvh);
      height: max(56.25vw, 100dvh);
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
    }

    .click-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      cursor: pointer;
      background: transparent;
    }

    .logo-container {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      z-index: 6;
      display: flex;
      justify-content: center;
      cursor: pointer;
    }

    .logo-container img {
      display: block;
      width: auto;
      height: 50px;
    }

    .footer {
      width: 100%;
      padding: 10px 15px;
      background: #fff;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    .footer-text {
      margin-bottom: 10px;
      color: #333;
      font: italic 9px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .footer-logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .footer-logos img {
      width: min(120px, 18vw);
      height: auto;
    }

    @media (max-width: 640px) {
      .logo-container {
        top: 20px;
      }

      .logo-container img {
        height: 35px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .logo-container {
        top: 10px;
      }

      .logo-container img {
        height: 30px;
      }
    }
  </style>
</head>

<body>
  <main class="video-container">
    <div class="video-layer" id="videoA"></div>
    <div class="video-layer is-hidden" id="videoB"></div>

    <div class="click-overlay" id="next-video" aria-label="Siguiente vídeo"></div>

    <div class="logo-container" id="logo-link">
      <img src="public/logo.png" alt="SAYOS DE ALFONSO" id="logo">
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p class="footer-text">
        Aquesta actuació està impulsada i subvencionada pel Departament d'Empresa i Treball
        i cofinançada per la Unió Europea mitjançant el Fons Social Europeu Plus.
      </p>

      <div class="footer-logos">
        <img src="public/images/icons/icon_1.png" alt="Logotip institucional 1">
        <img src="public/images/icons/icon_2.png" alt="Logotip institucional 2">
        <img src="public/images/icons/icon_3.jpg" alt="Logotip institucional 3">
        <img src="public/images/icons/icon_4.svg" alt="Logotip institucional 4">
      </div>
    </div>
  </footer>

  <script>
    (() => {
      const videoIds = [
        "1196639365",
        "1190537623",
        "1196639364",
        "1196639407",
        "1196639406",
        "1196639363",
        "1196639383",
        "1196639404"
      ];

      const layers = [
        document.getElementById("videoA"),
        document.getElementById("videoB")
      ];

      const nextButton = document.getElementById("next-video");
      const logo = document.getElementById("logo");
      const logoLink = document.getElementById("logo-link");

      const storageKey = "vimeoCurrentIndex";
      let currentIndex = Number(sessionStorage.getItem(storageKey));
      let activeLayer = 0;
      let changing = false;

      if (!Number.isInteger(currentIndex) || currentIndex < 0 || currentIndex >= videoIds.length) {
        currentIndex = Math.floor(Math.random() * videoIds.length);
      }

      function videoUrl(id) {
        return `https://player.vimeo.com/video/${id}?background=1&autoplay=1&muted=1&loop=1&autopause=0&controls=0&title=0&byline=0&portrait=0`;
      }

      function loadVideo(layer, id) {
        layer.innerHTML = "";
        const iframe = document.createElement("iframe");
        iframe.src = videoUrl(id);
        iframe.title = "Vídeo de fondo";
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.setAttribute("allowfullscreen", "");
        iframe.setAttribute("frameborder", "0");
        layer.appendChild(iframe);
      }

      function showInitialVideo() {
        loadVideo(layers[activeLayer], videoIds[currentIndex]);
        sessionStorage.setItem(storageKey, currentIndex);
      }

      function nextVideo() {
        if (changing) return;
        changing = true;

        const nextLayerIndex = 1 - activeLayer;
        const nextIndex = (currentIndex + 1) % videoIds.length;
        const nextLayer = layers[nextLayerIndex];
        const currentLayer = layers[activeLayer];

        loadVideo(nextLayer, videoIds[nextIndex]);
        nextLayer.classList.remove("is-hidden");
        currentLayer.classList.add("is-hidden");

        currentIndex = nextIndex;
        activeLayer = nextLayerIndex;
        sessionStorage.setItem(storageKey, currentIndex);

        window.setTimeout(() => {
          currentLayer.innerHTML = "";
          changing = false;
        }, 450);
      }

      nextButton.addEventListener("click", nextVideo);

      logo.addEventListener("mouseenter", () => {
        logo.src = "public/logo-hover.png";
      });

      logo.addEventListener("mouseleave", () => {
        logo.src = "public/logo.png";
      });

      logoLink.addEventListener("click", (event) => {
        event.stopPropagation();
        window.location.href = "https://www.sayosdealfonso.com/about";
      });

      showInitialVideo();
    })();
  </script>
</body>
</html>
